services:
  database:
    container_name: archivum-database
    image: postgres:18
    ports:
      - '5432:5432'
    environment:
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=admin
      - POSTGRES_DB=archivum
    volumes:
      - pgdata:/var/lib/postgresql

  smtp:
    container_name: archivum-smtp
    image: rnwood/smtp4dev:v3
    ports:
      - '5000:80'
      - '2525:25'
    volumes:
      - smtp4dev-data:/smtp4dev

volumes:
  pgdata:
  smtp4dev-data:
